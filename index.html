<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!--ICON-->
        <header>
            <a href="#" class="app-title">WEATHER</a>
        </header>

        <!--main-page-->
        <main class="main">

            <!--今日の天気-->
            <section class="current-weather">
                <p class="date" id="date">YYYY年MM月DD日</p>
                <p class="current-map" id="city">東京都</p>
                <div class="weather-row">
                    <div class="temp-range">
                        <span class="temp-max" id="temp-max">26℃</span>
                        <span>/</span>
                        <span class="temp-min" id="temp-min">19℃</span>
                    </div>
                    <div class="weather-icon" id="icon">🌤️</div>
                </div>
                <div class="border">＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
                <div class="weather-row">
                    <div class="current-detail">
                        <p>今日の詳細▶</p>
                    </div>
                    <div class="current-detail">
                        <span id="humidity">10%</span>
                    </div>
                    <div class="current-detail">
                        <span id="wind">1m/s</span>
                    </div>
                </div>
            </section>

            <!--時間ごとの天気-->
            <section class="date-weather">
                <p class="date">時間ごとの天気</p>
                <div class="carousel-wrapper">
                    <div id="current-date-label" class="floating-date"></div>
                    <div class="carousel" id="hourly"></div>
                </div>
            </section>

            <!--1週間の天気-->
            <section class="weekly-weather">
                <h3 class="date">1週間の天気</h3>
                <div class="carousel-wrapper">
                    <div id="current-weekly-label" class="floating-date"></div>
                    <div class="carousel" id="weekly"></div>
                </div>
            </section>

        </main>

        <footer>
            <section>
                <div class="weather-row">
                    <a href="#" class="current-detail">天気</a>
                    <a href="#" class="current-detail">お気に入り</a>
                    <a href="#" class="current-detail">設定</a>
                </div>
            </section>
        </footer>

        <script src="script.js"></script>
    </body>
    
</html>
