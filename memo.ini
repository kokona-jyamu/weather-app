JS

今回の流れ
準備: let / const で変数を作成。API取得。
計算: APIから「小包（JSON）」を await で受け取り、filter で必要な分だけ絞り込む。
整理: groupedに日付ごとにデータ挿入、整列。forEach量産。
演出: index / scroll / animation
起動: DOMContentLoaded

[var]
再宣言と再代入のどちらも可
[const]
再宣言と再代入どちらも不可。一度きりだよ！
[let]
再代入は可。再宣言は不可。


[.padStart(a,'b')]
String型に対応しているメソッド
対象の文字列が指定した長さになるようにする命令
＊今回の場合＊
.padStart(2, '0')
⇒「2文字」という指定した文字数に足りなければで「0」で左側を埋めてね

[filter]
複数の値を返す
[find]
最初の1つだけ返す

▼ 以下読解 ▼
if (!grouped[date]) {
      grouped[date] = [];
}
----------------------------------------------------------------------------------------------------
!grouped[date] : この日付の引き出しがまだ無い場合
grouped[date] = [] : この日付名で新しい空の引き出しを作成
⇒同じ日付のデータが2回目、3回目と出てきたときは、既存の引き出しをそのまま使うことが可能になる。（重複を防ぐ）



コンテナスクロールについて
container.scrollLeft      : スクロールの程度
container.offsetWidth / 2 : コンテナの横幅の半分
Distance = infinity       : 初期設定を無限大にしておく