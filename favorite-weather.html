<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="favorite-weather.css">
        <link rel="stylesheet" href="style.css">
    </head>

     <body>
        <!--ICON-->
        <header>
            <a href="index.html" class="app-title">WEATHER</a>
        </header>

        <!--main-page-->
        <main class="main">
            <!--お気に入り地域表示（4か所まで）-->
            <form class="search-form" method="get" action="">
                <label class="search-city" for="city">都市名検索:</label>
                <input class="search-cityname" type="text" id="city" name="city" required>
                <button class="search-check" type="submit">確認</button>
            </form>

            <!--今日の天気-->
            <section class="current-weather">
                <p class="date" id="date">YYYY年MM月DD日</p>
                <p class="current-map" id="city-name"></p>
                <div class="weather-row">
                    <div class="temp-range">
                        <span class="temp-max" id="temp-max">26℃</span>
                        <span>/</span>
                        <span class="temp-min" id="temp-min">19℃</span>
                    </div>
                    <div class="weather-icon" id="icon">🌤️</div>
                </div>
                <div class="border">＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>
                <div class="weather-row">
                    <div class="current-detail">
                        <p>今日の詳細▶</p>
                    </div>
                    <div class="current-detail">
                        <span id="humidity">10%</span>
                    </div>
                    <div class="current-detail">
                        <span id="wind">1m/s</span>
                    </div>
                </div>
            </section>


        </main>

        <!--bottom button-->
        <footer>
            <section>
                <div class="tab-switch">
                        <a href="index.html" class="tab-content">天気</a> 
                        <a href="favorite-weather.html" class="tab-content">お気に入り</a> 
                        <a href="setting-page.html" class="tab-content">設定</a> 
                        </label> 
            </section>
        </footer>   

            <script src="script.js"></script>
        </body>
    
</html>
